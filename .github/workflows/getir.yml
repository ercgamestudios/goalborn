{"name":"hikaye-getir","on":{"push":{"paths":[".github/workflows/getir.yml"]},"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"getir":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"run":"set -e; B=https://goalborn.pages.dev; mkdir -p omer omer_en; for f in omer/hikaye.json omer/hikaye_en.json; do curl -fsSL --retry 3 -o $f $B/$f; done; for d in omer omer_en; do for i in 01 02 03 04 05 06 07 08 09 10; do for s in .jpg .mp4 _a.mp4 _b.mp4; do curl -fsSL --retry 3 -o $d/o$i$s $B/$d/o$i$s; done; done; done; curl -fsSL -o index.html $B/index.html || true; touch .nojekyll; ls omer | wc -l; ls omer_en | wc -l; du -sh omer omer_en; git config user.name github-actions; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add -A; git commit -m 'Hikaye dosyalari: pages.dev kopyasi'; git push"}]}}}
